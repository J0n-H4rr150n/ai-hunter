---
# CTF IDOR Playbook
# Objective: Test for Insecure Direct Object References in CTF/vulnerable apps

metadata:
  name: "CTF IDOR Testing"
  version: "1.0"
  description: "Comprehensive playbook for discovering and exploiting IDOR vulnerabilities in CTF environments"
  objective: "Find and demonstrate IDOR vulnerabilities to capture flags or gain unauthorized access"
  author: "AI Hunter"
  category: "CTF"
  difficulty: "beginner-intermediate"
  estimated_duration: "30-60 minutes"
  
  # Tags for filtering in UI
  tags:
    - "ctf"
    - "idor"
    - "broken-access-control"
    - "owasp-top10"

# Runbook execution sequence
sequence:
  - runbook: "init_runbook"
    stage: 1
    name: "Initial Reconnaissance"
    required: true
    description: "Gather comprehensive information about target application"
    hitl_checkpoint: false  # Auto-proceed to next runbook
    on_complete:
      action: "proceed"  # or "wait_for_approval"
    on_failure:
      action: "abort"  # Stop playbook if init fails
      
  - runbook: "ctf_runbook"
    stage: 2
    name: "CTF Challenge Solving"
    required: true
    description: "Intelligent CTF testing with flag detection and validation"
    hitl_checkpoint: false  # Let agent work autonomously
    prerequisites:
      findings_required:
        - "page_load_status"
      minimum_findings: 1
    on_complete:
      action: "conditional"  # Decide based on results
      if_flag_found: "proceed_to_report"
      if_flag_not_found: "proceed_to_brainstorm"
    on_failure:
      action: "proceed"  # Still go to brainstorm even if runbook fails
      
  - runbook: "brainstorm_runbook"
    stage: 3
    name: "Creative Analysis & Next Steps"
    required: true
    description: "Agent-guided creative problem solving when standard tests don't find flags"
    hitl_checkpoint: true  # Human reviews brainstorm results
    conditional: "only_if_flag_not_found"
    on_complete:
      action: "complete"  # End playbook after brainstorm
    on_failure:
      action: "complete"  # Always complete after brainstorm
  
  - runbook: "report_runbook"
    stage: 4
    name: "Final Reporting"
    required: false
    description: "Generate comprehensive report of findings"
    hitl_checkpoint: false
    conditional: "only_if_flag_found"
    on_complete:
      action: "complete"
    on_failure:
      action: "complete"

# Conditional branching based on findings
conditional_steps:
  # If flag found in CTF runbook, skip brainstorm and go to report
  - condition:
      type: "finding_match"
      pattern: "flags_validated|flag_found"
      source_runbook: "ctf_runbook"
    then:
      skip_runbook: "brainstorm_runbook"
      execute_runbook: "report_runbook"
      description: "Flag discovered, generating victory report"
  
  # If no flag found, ensure brainstorm runs
  - condition:
      type: "finding_not_found"
      pattern: "flags_validated"
      source_runbook: "ctf_runbook"
    then:
      ensure_runbook: "brainstorm_runbook"
      reason: "No flag found via standard testing, need creative analysis"
  
  # If IDOR found with potential flags, add idor_runbook
  - condition:
      type: "finding_match"
      pattern: "idor_candidates|idor_patterns"
      source_runbook: "ctf_runbook"
    then:
      insert_runbook: "idor_runbook"
      at_stage: 2.5  # Between CTF and brainstorm
      description: "Strong IDOR indicators found, running targeted IDOR tests"

# Human-in-the-loop checkpoints
hitl_checkpoints:
  - stage: "before_stage_2"
    message: "Initial reconnaissance complete. Review findings before starting IDOR tests."
    options:
      - action: "continue"
        label: "Start IDOR Testing"
      - action: "skip_to_stage"
        target_stage: 3
        label: "Skip to Brainstorm"
      - action: "abort"
        label: "Stop Playbook"
  
  - stage: "after_stage_2"
    message: "IDOR testing complete. Review findings before analysis phase."
    options:
      - action: "continue"
        label: "Proceed to Analysis"
      - action: "retry_stage"
        target_stage: 2
        label: "Re-run IDOR Tests"
      - action: "abort"
        label: "Stop Playbook"

# Playbook-level configuration
configuration:
  # Mission parameters
  mission_goal: "Discover and document IDOR vulnerabilities"
  success_metrics:
    - "At least 1 IDOR vulnerability confirmed"
    - "Unauthorized data access demonstrated"
    - "Impact assessed (horizontal or vertical escalation)"
  
  # Testing constraints
  constraints:
    max_requests_per_minute: 100
    timeout_per_runbook: 1800  # 30 minutes
    require_auth: false  # CTFs often don't require auth
    
  # LLM settings for this playbook
  llm_settings:
    model: "gemini-2.0-flash-exp"
    temperature: 0.3  # Lower temp for precise testing
    budget_per_runbook: 50000  # Token budget
  
  # Reporting preferences
  reporting:
    generate_report_after_each_runbook: true
    include_screenshots: true
    proof_of_concept_required: true

# Success criteria for entire playbook
success_criteria:
  required:
    - "init_runbook completed successfully"
    - "idor_runbook attempted (success not required)"
    - "brainstorm_runbook completed"
  optional:
    - "At least 1 IDOR vulnerability found"
    - "Impact demonstrated (horizontal or vertical)"
    - "Remediation guidance provided"

# Failure criteria (abort playbook if met)
failure_criteria:
  - "Target unreachable or offline"
  - "Authentication required but not provided"
  - "Rate limiting prevents testing"
  - "User manually aborted"

# Expected outputs
outputs:
  - "Comprehensive findings report"
  - "List of vulnerable endpoints with POC"
  - "Risk assessment for discovered issues"
  - "Next steps recommendation from brainstorm"
  - "Exploitation chain analysis (if applicable)"