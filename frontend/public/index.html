<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hunter - Autonomous Security Agent</title>

    <!-- Tailwind CSS via CDN for now (will compile locally later) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>

    <!-- Custom styles -->
    <style>
        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            }

            50% {
                box-shadow: 0 0 40px rgba(59, 130, 246, 0.8);
            }
        }

        .glow-pulse {
            animation: pulse-glow 2s infinite;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100">
    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 shadow-lg">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">🐝</span>
                <h1 class="text-2xl font-bold text-blue-400">AI Hunter</h1>
            </div>
            <div id="status-indicator" class="flex items-center space-x-2">
                <div class="w-3 h-3 bg-gray-500 rounded-full" id="status-dot"></div>
                <span id="status-text" class="text-sm text-gray-400">Disconnected</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-8">
        <!-- Mission Control -->
        <section id="mission-control" class="mb-8">
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <h2 class="text-xl font-semibold mb-4 text-blue-300">🚀 Start New Mission</h2>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-2">Target URL</label>
                        <input type="url" id="target-url"
                            class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="https://example.com">
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-2">Mission Instructions (Optional)</label>
                        <textarea id="instructions" rows="3"
                            class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Focus on ID parameters, avoid account creation..."></textarea>
                    </div>

                    <button id="start-mission-btn"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 transform hover:scale-105">
                        Start Mission
                    </button>
                </div>
            </div>
        </section>

        <!-- Plan Approval Section (Hidden by default) -->
        <section id="plan-approval" class="mb-8 hidden">
            <div class="bg-gray-800 rounded-lg p-6 border-2 border-yellow-500 glow-pulse">
                <h2 class="text-xl font-semibold mb-4 text-yellow-300">⏸️ Plan Approval Required</h2>

                <div id="plan-display" class="mb-6 space-y-4">
                    <!-- Plan content will be inserted here -->
                </div>

                <div class="flex space-x-4">
                    <button id="approve-btn"
                        class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200">
                        ✅ Approve & Execute
                    </button>
                    <button id="edit-btn"
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200">
                        ✏️ Edit Plan
                    </button>
                    <button id="reject-btn"
                        class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200">
                        ❌ Reject
                    </button>
                </div>
            </div>
        </section>

        <!-- Mission Status -->
        <section id="mission-status" class="mb-8">
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <h2 class="text-xl font-semibold mb-4 text-green-300">📊 Mission Status</h2>
                <div id="status-content" class="text-gray-400">
                    <p>No active mission</p>
                </div>
            </div>
        </section>

        <!-- Live Feed -->
        <section id="live-feed">
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <h2 class="text-xl font-semibold mb-4 text-purple-300">📡 Live Activity Feed</h2>
                <div id="feed-content" class="space-y-2 max-h-96 overflow-y-auto">
                    <!-- Live updates will appear here -->
                </div>
            </div>
        </section>
    </main>

    <!-- SSE Client Script -->
    <script src="app.js"></script>
</body>

</html>
