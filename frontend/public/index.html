<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hunter - Autonomous Security Agent</title>

    <!-- Tailwind CSS via CDN for now (will compile locally later) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>

    <!-- Custom styles -->
    <style>
        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            }

            50% {
                box-shadow: 0 0 40px rgba(59, 130, 246, 0.8);
            }
        }

        .glow-pulse {
            animation: pulse-glow 2s infinite;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100">
    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 shadow-lg">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">🐝</span>
                <h1 class="text-2xl font-bold text-blue-400">AI Hunter</h1>
            </div>
            <div class="flex items-center space-x-6">
                <button id="open-mission-modal" class="text-blue-400 hover:text-blue-300 font-semibold transition">
                    + New Mission
                </button>
                <div id="status-indicator" class="flex items-center space-x-2">
                    <div class="w-3 h-3 bg-gray-500 rounded-full" id="status-dot"></div>
                    <span id="status-text" class="text-sm text-gray-400">Disconnected</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-4 h-screen flex flex-col" style="height: calc(100vh - 80px);">
        <!-- Live Feed - Full Height -->
        <section id="live-feed" class="flex-1 flex flex-col">
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700 flex flex-col h-full">
                <h2 class="text-xl font-semibold mb-4 text-purple-300">📡 Live Activity Feed</h2>
                <div id="feed-content" class="space-y-2 overflow-y-auto flex-1">
                    <!-- Live updates will appear here -->
                </div>
            </div>
        </section>
    </main>

    <!-- Mission Modal -->
    <div id="mission-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="bg-gray-800 rounded-lg p-8 max-w-2xl w-full mx-4 border border-gray-700 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-semibold text-blue-300">🚀 Start New Mission</h2>
                <button id="close-mission-modal" class="text-gray-400 hover:text-gray-200 text-2xl">
                    ×
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Target URL</label>
                    <input type="url" id="target-url"
                        class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="http://localhost:62287/">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Mission Instructions (Optional)</label>
                    <textarea id="instructions" rows="4"
                        class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Every time you see a value that looks like an ID, you should try to fuzz it with similar values. Do not try to create any new accounts."></textarea>
                </div>

                <button id="start-mission-btn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 transform hover:scale-105">
                    Start Mission
                </button>
            </div>
        </div>
    </div>

    <!-- SSE Client Script -->
    <script src="app.js"></script>
</body>

</html>
