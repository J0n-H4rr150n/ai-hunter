[tool.poetry]
name = "ai-hunter"
version = "0.1.0"
description = "Autonomous web security testing agent driven by a locally hosted LLM."
authors = ["J0n-H4rr150n <harrison.jonb@gmail.com>"]
readme = "README.md"
packages = [{include = "core"}, {include = "tools"}, {include = "memory"}, {include = "config"}, {include = "agents"}]

[tool.poetry.dependencies]
python = "^3.12"
# Also the transport for the local llama-server OpenAI-compatible API
requests = "^2.31.0"
Pillow = "^10.0.0"
# We explicitly request Numpy 2.1+ which has Python 3.13 wheels
numpy = "^2.1.0"
# Playwright for browser automation
playwright = "^1.49.0"
# FastAPI for backend API
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
# PostgreSQL with async support
asyncpg = "^0.29.0"
# PostgreSQL sync driver for Alembic
psycopg2-binary = "^2.9.9"
# Redis for pub/sub and caching
redis = {extras = ["hiredis"], version = "^5.0.0"}
# Alembic for database migrations
alembic = "^1.13.0"
# Runbook / playbook definitions
PyYAML = "^6.0"

# Optional: pgvector semantic search over past findings (DISABLE_EMBEDDINGS=true by
# default). TensorFlow is a heavy install, so it is opt-in via `poetry install -E embeddings`.
tensorflow = {version = "^2.15.0", optional = true}
tensorflow-hub = {version = "^0.16.1", optional = true}
tensorflow-text = {version = "^2.15.0", optional = true}

[tool.poetry.extras]
embeddings = ["tensorflow", "tensorflow-hub", "tensorflow-text"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"