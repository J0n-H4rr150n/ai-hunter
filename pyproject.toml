[tool.poetry]
name = "hive-mind-agent"
version = "0.1.0"
description = "Autonomous agent with hive-mind structured storage and local semantic search."
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "core"}, {include = "tools"}, {include = "memory"}, {include = "config"}]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31.0"
Pillow = "^10.0.0"
# We explicitly request Numpy 2.1+ which has Python 3.13 wheels
numpy = "^2.1.0"
# Force CPU-only PyTorch (no CUDA) - must be before sentence-transformers
torch = {version = "^2.5.0", source = "pytorch-cpu"}
# We update sentence-transformers to the latest to hope for Numpy 2.x compatibility
sentence-transformers = "^3.2.0"
# Playwright for browser automation
playwright = "^1.49.0"
# Google Cloud Vertex AI for Gemini LLM
google-cloud-aiplatform = "^1.38.0"
# FastAPI for backend API
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
# PostgreSQL with async support
asyncpg = "^0.29.0"
# PostgreSQL sync driver for Alembic
psycopg2-binary = "^2.9.9"
# Redis for pub/sub and caching
redis = {extras = ["hiredis"], version = "^5.0.0"}
# Alembic for database migrations
alembic = "^1.13.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"